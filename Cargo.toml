[package]
name = "cowtree"
version = "0.1.0"
edition = "2024"
description = "Compact Git worktrees with copy-on-write filesystem clones"
license = "MIT"
repository = "https://github.com/markjaquith/cowtree"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
