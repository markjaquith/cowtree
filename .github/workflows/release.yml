name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Package
        run: |
          archive="cowtree-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C 'target/${{ matrix.target }}/release' -czf "$archive" cowtree
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cowtree-${{ matrix.target }}
          path: cowtree-*.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cowtree-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: cowtree-*.tar.gz*
          generate_release_notes: true
