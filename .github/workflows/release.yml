name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Package
        run: |
          archive="cowtree-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C 'target/${{ matrix.target }}/release' -czf "$archive" cowtree
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cowtree-${{ matrix.target }}
          path: cowtree-*.tar.gz*
  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        run: |
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$crate_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $crate_version" >&2
            exit 1
          fi
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cowtree-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: cowtree-*.tar.gz*
          generate_release_notes: true

  update-homebrew:
    needs: [publish-crate, publish-github-release]
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
